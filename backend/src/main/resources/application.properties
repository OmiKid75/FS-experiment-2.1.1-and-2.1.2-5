spring.application.name=helpdesk

# MongoDB connection - never hardcode credentials, use env vars
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/helpdesk}

server.port=${SERVER_PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.helpdesk=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n

# Don't leak stack traces in error responses
server.error.include-stacktrace=never
server.error.include-message=never
